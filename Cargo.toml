[package]
name = "rqsrv"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
bytemuck = "1.25.0"
fast-socks5 = "1.0.0"
hex = "0.4.3"
hex-literal = "1.1.0"
pretty-hex = "0.4.1"
rand = "0.10.0"
rc4 = { version = "0.1.0", features = ["std"] }
rsa = { version = "0.9.10", features = ["hazmat"] }
tokio = { version = "1.50.0", features = ["rt-multi-thread", "macros", "net"] }
