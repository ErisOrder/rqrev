[package]
name = "rqsrv"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
bytemuck = "1.25.0"
derive_more = { version = "2.1.1", features = ["debug", "try_unwrap"] }
fast-socks5 = "1.0.0"
hex = "0.4.3"
hex-literal = "1.1.0"
num_enum = "0.7.5"
pretty-hex = "0.4.1"
rand = "0.10.0"
rc4 = { version = "0.1.0", features = ["std"] }
ringbuf = "0.4.8"
rsa = { version = "0.9.10", features = ["hazmat"] }
serde = { version = "1.0.228", features = ["derive", "std", "alloc"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["rt-multi-thread", "macros", "net"] }
